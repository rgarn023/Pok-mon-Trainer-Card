name: Apply v28 editor patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v28-editor-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ip = Path('index.html')
          s = ip.read_text()
          s = s.replace('Trainer Card Studio v27', 'Trainer Card Studio v28')
          s = s.replace('v27 · manual card builder + local OCR · no AI', 'v28 · manual card builder + local OCR · no AI')
          s = s.replace('CUSTOM TRAINER CARD MAKER · VERSION 27', 'CUSTOM TRAINER CARD MAKER · VERSION 28')
          s = s.replace('studio-v27.css?v=27', 'studio-v27.css?v=28')
          s = s.replace('studio-v27.js?v=27', 'studio-v27.js?v=28')
          s = s.replace('_v27.png', '_v28.png')

          team_end = '''        </section>\n\n        <section class="panel">\n          <div class="panelhead"><div><span class="num">03</span><h2>Trainer details</h2>'''
          bg_panel = '''        </section>\n\n        <section class="panel">\n          <div class="panelhead"><div><span class="num">BG</span><h2>Card backgrounds</h2><p>Use the built-in team style, upload one image for both sides, or use separate images for the front and back.</p></div><span class="chip">Optional</span></div>\n          <div class="backgroundGrid">\n            <div class="backgroundCard"><h3>One image for both sides</h3><p>This becomes the background for both the front and back unless a side-specific image is uploaded.</p><label class="miniUpload">Choose shared background<input id="sharedBgInput" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="sharedBgSourceCard" class="sourceCard hidden"><img id="sharedBgThumb" alt="shared card background"><div><b id="sharedBgName"></b><small>Front + back</small></div></div></div>\n            <div class="backgroundCard"><h3>Front background</h3><p>Optional. Overrides the shared image on the front only.</p><label class="miniUpload">Choose front background<input id="frontBgInput" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="frontBgSourceCard" class="sourceCard hidden"><img id="frontBgThumb" alt="front card background"><div><b id="frontBgName"></b><small>Front only</small></div></div></div>\n            <div class="backgroundCard"><h3>Back background</h3><p>Optional. Overrides the shared image on the back only.</p><label class="miniUpload">Choose back background<input id="backBgInput" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="backBgSourceCard" class="sourceCard hidden"><img id="backBgThumb" alt="back card background"><div><b id="backBgName"></b><small>Back only</small></div></div></div>\n          </div>\n          <div class="row"><button id="clearBackgroundsBtn" class="secondary" type="button">Clear custom backgrounds</button><small>Custom background files stay in your browser and are drawn directly into the exported card.</small></div>\n        </section>\n\n        <section class="panel">\n          <div class="panelhead"><div><span class="num">03</span><h2>Trainer details</h2>'''
          if team_end not in s:
              raise SystemExit('index team insertion point not found')
          s = s.replace(team_end, bg_panel, 1)

          s = s.replace('''              <div class="rangeGrid">\n                <label>Card trainer width <output id="trainerFrameWOut">520</output><input id="trainerFrameW" type="range" min="360" max="620" value="520" step="10"></label>\n                <label>Card trainer height <output id="trainerFrameHOut">560</output><input id="trainerFrameH" type="range" min="390" max="600" value="560" step="10"></label>\n              </div>''','''              <div class="rangeGrid">\n                <label>Card trainer width <output id="trainerFrameWOut">520</output><input id="trainerFrameW" type="range" min="360" max="620" value="520" step="10"></label>\n                <label>Card trainer height <output id="trainerFrameHOut">560</output><input id="trainerFrameH" type="range" min="390" max="600" value="560" step="10"></label>\n                <label>Image zoom <output id="trainerZoomOut">1.00×</output><input id="trainerZoom" type="range" min="0.25" max="2" value="1" step="0.05"></label>\n                <label class="checkLabel"><input id="trainerUseFull" type="checkbox"> Use whole uploaded screenshot</label>\n              </div>''',1)

          s = s.replace('''              <div class="cropResult"><img id="buddyResult" class="circle hidden" alt="buddy crop"><div><b>Buddy image</b><span id="buddyResultText">No crop yet.</span></div></div>''','''              <div class="cropResult"><img id="buddyResult" class="circle hidden" alt="buddy crop"><div><b>Buddy image</b><span id="buddyResultText">No crop yet.</span></div></div>\n              <div class="rangeGrid"><label>Image zoom <output id="buddyZoomOut">1.00×</output><input id="buddyZoom" type="range" min="0.25" max="2" value="1" step="0.05"></label><label class="checkLabel"><input id="buddyUseFull" type="checkbox"> Use whole uploaded screenshot</label></div>''',1)
          s = s.replace('''              <div class="cropResult"><img id="lookingResult" class="circle hidden" alt="looking for crop"><div><b>Looking For image</b><span id="lookingResultText">No crop yet.</span></div></div>''','''              <div class="cropResult"><img id="lookingResult" class="circle hidden" alt="looking for crop"><div><b>Looking For image</b><span id="lookingResultText">No crop yet.</span></div></div>\n              <div class="rangeGrid"><label>Image zoom <output id="lookingZoomOut">1.00×</output><input id="lookingZoom" type="range" min="0.25" max="2" value="1" step="0.05"></label><label class="checkLabel"><input id="lookingUseFull" type="checkbox"> Use whole uploaded screenshot</label></div>''',1)
          s = s.replace('''              <div class="cropResult"><img id="favoriteResult" class="circle hidden" alt="favorite Pokémon crop"><div><b>Favorite image</b><span id="favoriteResultText">No crop yet.</span></div></div>''','''              <div class="cropResult"><img id="favoriteResult" class="circle hidden" alt="favorite Pokémon crop"><div><b>Favorite image</b><span id="favoriteResultText">No crop yet.</span></div></div>\n              <div class="rangeGrid"><label>Image zoom <output id="favoriteZoomOut">1.00×</output><input id="favoriteZoom" type="range" min="0.25" max="2" value="1" step="0.05"></label><label class="checkLabel"><input id="favoriteUseFull" type="checkbox"> Use whole uploaded screenshot</label></div>''',1)
          ip.write_text(s)

          cp = Path('studio-v27.css')
          c = cp.read_text()
          c += '''\n.backgroundGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.backgroundCard{border:1px solid var(--line);border-radius:15px;padding:11px;background:rgba(255,255,255,.018)}.backgroundCard h3{margin:0 0 3px;font-size:12px}.backgroundCard p{margin:0 0 9px;color:var(--muted);font-size:8px;line-height:1.4}.checkLabel{display:flex!important;align-items:center;gap:7px;min-height:48px}.checkLabel input{width:auto!important;accent-color:var(--accent)}@media(max-width:700px){.backgroundGrid{grid-template-columns:1fr}}\n'''
          cp.write_text(c)

          jp = Path('studio-v27.js')
          j = jp.read_text()
          j = j.replace("outputs:{trainer:null,buddy:null,looking:null,favorite:null}, frame:{w:520,h:560}", "outputs:{trainer:null,buddy:null,looking:null,favorite:null}, frame:{w:520,h:560}, slotZoom:{trainer:1,buddy:1,looking:1,favorite:1}, slotUseFull:{trainer:false,buddy:false,looking:false,favorite:false}, backgrounds:{shared:null,front:null,back:null}, bgURLs:{shared:'',front:'',back:''}")

          old_cover = "function cover(g,img,x,y,w,h,r=0){if(!img)return false;const iw=img.width||img.naturalWidth,ih=img.height||img.naturalHeight;if(!iw||!ih)return false;const sc=Math.max(w/iw,h/ih),sw=w/sc,sh=h/sc,sx=(iw-sw)/2,sy=(ih-sh)/2;g.save();if(r){rr(g,x,y,w,h,r);g.clip();}g.drawImage(img,sx,sy,sw,sh,x,y,w,h);g.restore();return true;}\nfunction circleImage(g,img,cx,cy,r){g.save();g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.clip();if(img)cover(g,img,cx-r,cy-r,r*2,r*2,0);else{g.fillStyle='rgba(255,255,255,.035)';g.fillRect(cx-r,cy-r,r*2,r*2);}g.restore();g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.stroke();}\nfunction drawBackdrop(g,p){const gr=g.createLinearGradient(0,0,900,1400);"
          new_cover = "function cover(g,img,x,y,w,h,r=0){if(!img)return false;const iw=img.width||img.naturalWidth,ih=img.height||img.naturalHeight;if(!iw||!ih)return false;const sc=Math.max(w/iw,h/ih),sw=w/sc,sh=h/sc,sx=(iw-sw)/2,sy=(ih-sh)/2;g.save();if(r){rr(g,x,y,w,h,r);g.clip();}g.drawImage(img,sx,sy,sw,sh,x,y,w,h);g.restore();return true;}\nfunction slotImage(g,img,x,y,w,h,zoom=1,r=0){if(!img)return false;const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)return false;const base=Math.max(w/iw,h/ih),sc=base*zoom,dw=iw*sc,dh=ih*sc,dx=x+(w-dw)/2,dy=y+(h-dh)/2;g.save();if(r){rr(g,x,y,w,h,r);g.clip();}g.fillStyle='rgba(3,6,10,.82)';g.fillRect(x,y,w,h);g.drawImage(img,dx,dy,dw,dh);g.restore();return true;}\nfunction chosenImage(kind){return S.slotUseFull[kind]?(S.sources[kind]||S.outputs[kind]):(S.outputs[kind]||S.sources[kind]);}\nfunction circleImage(g,img,cx,cy,r,zoom=1){g.save();g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.clip();g.fillStyle='rgba(3,6,10,.82)';g.fillRect(cx-r,cy-r,r*2,r*2);if(img)slotImage(g,img,cx-r,cy-r,r*2,r*2,zoom,0);g.restore();g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.stroke();}\nfunction drawBackdrop(g,p,side){const custom=S.backgrounds[side]||S.backgrounds.shared;if(custom){cover(g,custom,0,0,900,1400,0);g.fillStyle='rgba(3,6,11,.22)';g.fillRect(0,0,900,1400);}else{const gr=g.createLinearGradient(0,0,900,1400);"
          if old_cover not in j:
              raise SystemExit('cover/backdrop pattern not found')
          j = j.replace(old_cover,new_cover,1)
          j = j.replace("gr.addColorStop(0,p.dark);gr.addColorStop(.42,'#101725');gr.addColorStop(1,'#070a10');g.fillStyle=gr;g.fillRect(0,0,900,1400);g.globalAlpha=.16;g.strokeStyle=p.accent2;g.lineWidth=2;for(let i=-300;i<1300;i+=90){g.beginPath();g.moveTo(i,0);g.lineTo(i+700,1400);g.stroke();}g.globalAlpha=1;g.strokeStyle=p.accent;", "gr.addColorStop(0,p.dark);gr.addColorStop(.42,'#101725');gr.addColorStop(1,'#070a10');g.fillStyle=gr;g.fillRect(0,0,900,1400);g.globalAlpha=.16;g.strokeStyle=p.accent2;g.lineWidth=2;for(let i=-300;i<1300;i+=90){g.beginPath();g.moveTo(i,0);g.lineTo(i+700,1400);g.stroke();}g.globalAlpha=1;}g.strokeStyle=p.accent;",1)
          j = j.replace("drawBackdrop(g,p);g.fillStyle=p.accent2", "drawBackdrop(g,p,'front');g.fillStyle=p.accent2",1)
          j = j.replace("drawBackdrop(g,p);g.fillStyle=p.accent2", "drawBackdrop(g,p,'back');g.fillStyle=p.accent2",1)
          j = j.replace("if(!cover(g,S.outputs.trainer,fx,fy,fw,fh,20))", "if(!slotImage(g,chosenImage('trainer'),fx,fy,fw,fh,S.slotZoom.trainer,20))",1)
          j = j.replace("const br=122,bcx=760,bcy=360;", "const br=108,bcx=748,bcy=360;",1)
          j = j.replace("circleImage(g,S.outputs.buddy,bcx,bcy,br);", "circleImage(g,chosenImage('buddy'),bcx,bcy,br,S.slotZoom.buddy);",1)
          j = j.replace("const show=[{img:S.outputs.looking,name:", "const show=[{img:chosenImage('looking'),zoom:S.slotZoom.looking,name:",1)
          j = j.replace("{img:S.outputs.favorite,name:", "{img:chosenImage('favorite'),zoom:S.slotZoom.favorite,name:",1)
          j = j.replace("circleImage(g,it.img,it.x,1193,82);", "circleImage(g,it.img,it.x,1193,82,it.zoom);",1)

          insert_before = "function bindCrop(kind){"
          bg_code = """async function handleBackground(kind,file){if(!file)return;try{const {img,url}=await loadFile(file);revoke(S.bgURLs[kind]);S.bgURLs[kind]=url;S.backgrounds[kind]=img;const prefix=kind==='shared'?'sharedBg':kind==='front'?'frontBg':'backBg';$(prefix+'Thumb').src=url;$(prefix+'Name').textContent=file.name;$(prefix+'SourceCard').classList.remove('hidden');drawAll();}catch(e){console.error(e);toast('Could not open that background image.');}}\nfunction clearBackgrounds(){for(const k of ['shared','front','back']){revoke(S.bgURLs[k]);S.bgURLs[k]='';S.backgrounds[k]=null;const prefix=k==='shared'?'sharedBg':k==='front'?'frontBg':'backBg';$(prefix+'SourceCard')?.classList.add('hidden');const input=$(prefix+'Input');if(input)input.value='';}drawAll();toast('Custom backgrounds cleared.');}\n"""
          if insert_before not in j:
              raise SystemExit('bindCrop insertion point not found')
          j = j.replace(insert_before,bg_code+insert_before,1)

          reset_old = "S.outputs={trainer:null,buddy:null,looking:null,favorite:null};S.crops={trainer:{cx:.5,cy:.44,w:.62,h:.72},buddy:{cx:.5,cy:.45,r:.31},looking:{cx:.5,cy:.5,r:.30},favorite:{cx:.5,cy:.5,r:.30}};S.frame={w:520,h:560};"
          reset_new = "S.outputs={trainer:null,buddy:null,looking:null,favorite:null};S.crops={trainer:{cx:.5,cy:.44,w:.62,h:.72},buddy:{cx:.5,cy:.45,r:.31},looking:{cx:.5,cy:.5,r:.30},favorite:{cx:.5,cy:.5,r:.30}};S.frame={w:520,h:560};S.slotZoom={trainer:1,buddy:1,looking:1,favorite:1};S.slotUseFull={trainer:false,buddy:false,looking:false,favorite:false};for(const k of ['shared','front','back']){revoke(S.bgURLs[k]);S.bgURLs[k]='';S.backgrounds[k]=null;}"
          if reset_old not in j:
              raise SystemExit('reset state pattern not found')
          j = j.replace(reset_old,reset_new,1)

          event_anchor = "['trainer','buddy','looking','favorite'].forEach(kind=>{$(kind+'ShotInput')?.addEventListener('change',e=>handleImageKind(kind,e.target.files?.[0]));bindCrop(kind);});\n"
          event_extra = """['trainer','buddy','looking','favorite'].forEach(kind=>{const z=$(kind+'Zoom'),zo=$(kind+'ZoomOut'),full=$(kind+'UseFull');z?.addEventListener('input',()=>{S.slotZoom[kind]=+z.value;if(zo)zo.textContent=S.slotZoom[kind].toFixed(2)+'×';drawAll();});full?.addEventListener('change',()=>{S.slotUseFull[kind]=!!full.checked;drawAll();});});\n$('sharedBgInput')?.addEventListener('change',e=>handleBackground('shared',e.target.files?.[0]));$('frontBgInput')?.addEventListener('change',e=>handleBackground('front',e.target.files?.[0]));$('backBgInput')?.addEventListener('change',e=>handleBackground('back',e.target.files?.[0]));$('clearBackgroundsBtn')?.addEventListener('click',clearBackgrounds);\n"""
          if event_anchor not in j:
              raise SystemExit('event anchor not found')
          j = j.replace(event_anchor,event_anchor+event_extra,1)
          j = j.replace("_v27.png", "_v28.png")
          jp.write_text(j)

          # Self-delete so this temporary patch workflow is not part of the finished project.
          Path('.github/workflows/v28-editor-patch.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v28: custom backgrounds, safe buddy mask, image zoom-out"
          git push
