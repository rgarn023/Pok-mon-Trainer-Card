name = "pokemon-trainer-card-openai"
main = "worker.js"
compatibility_date = "2026-09-10"

[vars]
ALLOWED_ORIGIN = "https://rgarn023.github.io"
MAX_MONTHLY_USD = "0.90"

# Create a free Workers KV namespace in Cloudflare, then replace this id.
# The Worker refuses to call OpenAI unless the USAGE binding exists.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Add these as encrypted Worker secrets, never here:
# OPENAI_API_KEY
# ACCESS_CODE
